# Config do FluxOS para a VPS (convive com o ControlDesk via server_name diferente).
# Copie para /etc/nginx/sites-available/fluxosapp.tech.conf e ative com:
#   sudo ln -s /etc/nginx/sites-available/fluxosapp.tech.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Antes do certbot, HTTPS ainda não existe — rode certbot --nginx -d fluxosapp.tech
# que ele mesmo edita este arquivo para adicionar o bloco 443 e o redirect 80->443.

server {
    listen 80;
    listen [::]:80;
    server_name fluxosapp.tech;

    # Landing page (estática) na raiz do domínio
    root /var/www/fluxos/LandingPage;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sistema FluxOS (SPA React, build gerado em frontend/dist) em /app
    location /app/ {
        alias /var/www/fluxos/frontend/dist/;
        try_files $uri $uri/ /app/index.html;
    }

    # API do backend (Express), proxiada em /api -> remove o prefixo antes de repassar
    location /api/ {
        proxy_pass http://127.0.0.1:4010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
